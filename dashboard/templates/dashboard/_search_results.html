<!-- dashboard/templates/dashboard/_search_results.html -->
<table class="table table-striped table-hover align-middle bg-white">
    <thead>
        <tr>
            <th>CIN</th>
            <th>Name</th>
            <th>PPR</th>
            <th>Grade</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for cs in civil_servants %}
        <tr>
            <td><strong>{{ cs.CIN }}</strong></td>
            <td>{{ cs.nom }} {{ cs.prenom }}</td>
            <td>{{ cs.PPR }}</td>
            <td>
                {% if cs.JobDetail %}
                    <span class="badge bg-info text-dark">{{ cs.JobDetail.grade }}</span>
                {% else %}
                    <span class="badge bg-secondary">N/A</span>
                {% endif %}
            </td>
            <td>
                <a href="{% url 'dashboard:civil_servant_detail' cs.pk %}" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-eye"></i> View Profile
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
